[package]
name = "tmux-companion"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tmux-companion"
path = "src/main.rs"

[dependencies]
clap        = { version = "4.5",  features = ["derive"] }
tokio       = { version = "1.40", features = ["full"] }
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"
rusqlite    = { version = "0.32", features = ["bundled"] }
base64      = "0.22"
nix         = { version = "0.29", features = ["process", "signal", "user"] }
anyhow      = "1.0"
regex       = "1.11"
sysinfo     = "0.39"
battery     = "0.7"

[dev-dependencies]
tempfile = "3.12"
